name: Hrafnsyn
options:
  bundleIdPrefix: io.hrafnsyn
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Hrafnsyn
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Hrafnsyn connects to the tracking server you choose on your local network.
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: NO
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ARCHS: arm64
    OTHER_LDFLAGS: $(inherited) -lresolv
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Hrafnsyn:
    type: application
    platform: iOS
    sources:
      - Hrafnsyn
      - path: Generated/HrafnsynCore.swift
    dependencies:
      - framework: Frameworks/HrafnsynCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hrafnsyn.mobile
  HrafnsynTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Hrafnsyn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hrafnsyn.mobile.tests
schemes:
  Hrafnsyn:
    build:
      targets:
        Hrafnsyn: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - HrafnsynTests
